name: Desplegar TurnoYa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: desplegar
  cancel-in-progress: false

jobs:
  api:
    name: API (Cloudflare Worker + D1)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Revisar secretos
        id: listo
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::warning::Faltan CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID: no se despliega la API."; fi
      - name: Crear bucket R2 si no existe
        if: steps.listo.outputs.ok == '1'
        run: npx wrangler r2 bucket create turnoya-archivos || true
      - name: Migraciones D1
        if: steps.listo.outputs.ok == '1'
        run: npx wrangler d1 migrations apply turnoya --remote
      - name: Desplegar Worker
        if: steps.listo.outputs.ok == '1'
        run: npx wrangler deploy

  web:
    name: Web (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Compilar
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
          # "/" con dominio propio; "/olimpo-barber/" en crisio.github.io/olimpo-barber
          BASE_PATH: ${{ vars.DOMINIO_WEB != '' && '/' || '/olimpo-barber/' }}
          DOMINIO_WEB: ${{ vars.DOMINIO_WEB }}
        run: |
          npm run build
          if [ -n "$DOMINIO_WEB" ]; then echo "$DOMINIO_WEB" > dist/CNAME; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
      - id: pages
        uses: actions/deploy-pages@v4
